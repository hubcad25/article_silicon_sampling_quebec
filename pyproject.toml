[project]
name = "article-silicon-sampling-quebec"
version = "0.1.0"
description = "Code workspace for silicon sampling research on Quebec public opinion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "python-dotenv>=1.0.0",
  "duckdb>=1.1.0",
  "azure-storage-blob>=12.20.0",
  "azure-search-documents>=11.4.0",
  "numpy>=1.26",
  "scikit-learn>=1.3.0",
  # Exact Llama-3 token counts in scripts/15_prompt_report.py. Without it the
  # script silently falls back to a chars/token ratio and every figure becomes
  # an estimate — see the `method=chars` branch there.
  "tokenizers>=0.23.2",
]

[project.optional-dependencies]
finetune = [
  "unsloth",
  "peft>=0.10.0",
  "trl>=0.8.0",
  "bitsandbytes>=0.43.0",
  "accelerate>=0.29.0",
  "datasets>=2.18.0",
  "flash-attn>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
